<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoutbook</title>
<meta name="description" content="Scout photo and film locations: tap anywhere for light, weather, sun path and place info.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scoutbook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --panel-2:#f9f8f5; --ink:#1d1c1a; --muted:#6c6862; --line:#e3dfd7;
  --accent:#d4500f; --accent-ink:#fff; --accent-soft:#fbe6da; --focus:#2563eb;
  --st-scouted:#64748b; --st-shortlisted:#d97706; --st-approved:#15803d; --st-rejected:#b91c1c;
  --shadow:0 10px 30px rgba(0,0,0,.12); --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --panel:#1d1c1a; --panel-2:#24231f; --ink:#ecebe7; --muted:#a19d95; --line:#34322d;
    --accent:#f07a3c; --accent-ink:#1a0d05; --accent-soft:#3a2418; --focus:#60a5fa;
    --st-scouted:#94a3b8; --st-shortlisted:#f59e0b; --st-approved:#22c55e; --st-rejected:#ef4444;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1d1c1a; --panel-2:#24231f; --ink:#ecebe7; --muted:#a19d95; --line:#34322d;
  --accent:#f07a3c; --accent-ink:#1a0d05; --accent-soft:#3a2418; --focus:#60a5fa;
  --st-scouted:#94a3b8; --st-shortlisted:#f59e0b; --st-approved:#22c55e; --st-rejected:#ef4444;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
a.btn{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));padding-top:max(10px, env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);z-index:1200}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.search{flex:1;min-width:0;position:relative;max-width:460px}
.search input{width:100%;padding:8px 10px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--st-rejected)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn.icon{padding:7px}
.btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* Layout */
.layout{display:grid;grid-template-columns:350px 1fr;min-height:0;position:relative;overflow:clip}
#sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.filters{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{border-color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent)}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1;min-width:0}
select,input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],textarea{
  padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);width:100%}
.count{padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
#list{overflow:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:hover{background:var(--panel-2)}
.item.sel{background:var(--accent-soft)}
.thumb{width:64px;height:52px;border-radius:7px;background:var(--panel-2) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.item h3{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.stars{color:var(--st-shortlisted);letter-spacing:1px;font-size:12px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:10px 0 4px}

/* Map */
#mapWrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--panel-2)}
.map-tools{position:absolute;top:12px;left:12px;z-index:1000;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 140px)}
.map-tools .btn{box-shadow:var(--shadow)}
.place{position:relative}
.place input{width:240px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.place-results{position:absolute;top:calc(100% + 4px);left:0;width:320px;max-width:80vw;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.place-results button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-bottom:1px solid var(--line);font-size:13px}
.place-results button:hover{background:var(--panel-2)}
.banner{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:1050;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:13px}
.banner button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:2px 10px}
.adding #map{cursor:crosshair}
.adding .leaflet-grab{cursor:crosshair}

.pin-wrap{background:none;border:0}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
.pin span{width:8px;height:8px;border-radius:50%;background:#fff}
.pin.sel{transform:rotate(-45deg) scale(1.3)}
.pin.temp{background:var(--accent);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:rotate(-45deg) translate(2px,-2px)}}
.sky{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.sky th svg{width:13px;height:13px;vertical-align:-2px;color:var(--muted)}
.sky th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.sky td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.sky td small{display:block;color:var(--muted)}
.q{font-weight:700;font-variant-numeric:tabular-nums}
.q-good{color:var(--st-approved)}.q-flat{color:var(--st-rejected)}.q-clear{color:var(--st-shortlisted)}.q-mixed{color:var(--ink)}
.wx-now{display:flex;gap:12px;align-items:center}
.wx-now b{font-size:24px;font-variant-numeric:tabular-nums}
.wiki{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.wiki img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.wiki p{margin:4px 0;font-size:13px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.nearby{display:grid;gap:2px;margin-top:10px}
.nearby button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:none;padding:6px 4px;border-radius:6px;font-size:13px}
.nearby button:hover{background:var(--panel-2)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--panel-2),var(--line),var(--panel-2));background-size:200% 100%;animation:sk 1.2s linear infinite;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
/* place info panel — tabs */
.pshell{display:flex;flex-direction:column;flex:1;min-height:0}
.ph{padding:18px 16px 12px;border-bottom:0}
.ph h2{font-size:19px;letter-spacing:-.01em}
.ptabs{position:relative;display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line);padding:0 8px;background:var(--panel)}
.ptabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 10px;min-width:0;border:0;background:none;color:var(--muted);font-size:12px;position:relative;transition:color .2s}
.ptabs button svg{width:18px;height:18px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.ptabs button:hover{color:var(--ink)}
.ptabs button.on{color:var(--accent);font-weight:600}
.ptabs button.on svg{transform:translateY(-1px) scale(1.12)}
.ptabs .ld{position:absolute;top:6px;left:calc(50% + 8px);width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .3s}
.ptabs button.loading .ld{opacity:1;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.pind{position:absolute;bottom:-1px;left:8px;height:2px;width:calc((100% - 16px) / 6);background:var(--accent);border-radius:2px;transform:translateX(calc(var(--i,0) * 100%));transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.pane{padding:18px 0 28px;display:grid;gap:18px}
.pane > *{min-width:0}
.pane > .sec{padding:0;border:0}
.stagger > *{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.stagger.slide-r > *{animation-name:sr}.stagger.slide-l > *{animation-name:sl}
.stagger > *:nth-child(2){animation-delay:.05s}.stagger > *:nth-child(3){animation-delay:.1s}.stagger > *:nth-child(4){animation-delay:.15s}
.stagger > *:nth-child(5){animation-delay:.2s}.stagger > *:nth-child(6){animation-delay:.25s}.stagger > *:nth-child(n+7){animation-delay:.3s}
@keyframes sr{from{opacity:0;transform:translateX(18px)}}
@keyframes sl{from{opacity:0;transform:translateX(-18px)}}
.addr{display:flex;gap:12px;align-items:flex-start}
.addr > svg{color:var(--muted);margin-top:2px}
.addr .a1{font-weight:600;font-size:14px}
.line{display:flex;gap:12px;align-items:flex-start;font-size:13.5px}
.line > svg{color:#f59e0b;margin-top:1px}
.line small{display:block;color:var(--muted);font-size:11.5px}
.btn.block{width:100%;justify-content:center;padding:10px;border-radius:10px;transition:transform .15s, filter .2s}
.btn.block:active{transform:scale(.98)}
.iacts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.iact{display:grid;justify-items:center;gap:6px;padding:8px 2px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:12px;border:0;background:none;transition:background .2s, transform .15s}
.iact .ring{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.iact:hover{background:var(--panel-2)}.iact:hover .ring{transform:scale(1.1)}.iact:active{transform:scale(.95)}
details.more{border-top:1px solid var(--line)}
details.more summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .3s}
details.more[open] summary svg{transform:rotate(180deg)}
details.more .kv{padding-top:10px}
details.more[open] .kv{animation:up .35s both}
.dbody a:not(.btn):not(.iact){color:var(--accent);text-decoration:none}
.dbody a:not(.btn):not(.iact):hover{text-decoration:underline}
.foot{font-size:11.5px;color:var(--muted);margin:0}
.wxcard{display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,transparent),transparent 75%);border:1px solid var(--line)}
.wxcard .wx-ic{width:52px;height:52px;border-radius:16px}
.wxcard .wx-ic svg{width:28px;height:28px}
.temp{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini{display:grid;justify-items:center;gap:3px;padding:10px 4px;border-radius:12px;background:var(--panel-2)}
.mini svg{width:16px;height:16px;color:var(--muted)}
.mini b{font-size:13px;font-variant-numeric:tabular-nums}
.mini small{font-size:11px;color:var(--muted)}
.subh{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.days{display:grid;gap:6px}
.day{display:grid;grid-template-columns:58px 1fr 1fr;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--panel-2);font-size:12.5px}
.day .dl{font-weight:600}
.q2{display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center;min-width:0}
.q2 > svg{width:15px;height:15px;color:var(--muted);grid-row:span 2}
.q2 small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2)}
.wcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.wcard .wb{padding:12px 14px 14px;display:grid;gap:6px}
.wcard p{margin:0;font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.nearby button > svg{width:15px;height:15px;color:var(--muted);flex:none}
.nearby button span:first-of-type{flex:1;min-width:0}
.emptyst{display:grid;justify-items:center;gap:8px;padding:28px 0;color:var(--muted);text-align:center;font-size:13px}
.emptyst svg{width:28px;height:28px}
/* hero header, live chip, score gauge, chart, moon */
.ph.phero{min-height:168px;align-items:flex-end;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.08) 30%,rgba(0,0,0,.72)),var(--img) center/cover no-repeat}
.ph.phero .sub{color:rgba(255,255,255,.85)}
.ph.phero .badge{display:none}
.ph.phero h2{font-size:22px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ph.phero .btn.icon{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.35);color:#fff;border-color:transparent;backdrop-filter:blur(6px)}
.ph{position:relative}
.hero-in{animation:heroin .7s ease both}
@keyframes heroin{from{background-size:auto,115% auto;filter:saturate(.6) brightness(.8)}}
.livechip{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;width:max-content;max-width:100%;
  background:color-mix(in srgb,var(--lc) 16%,transparent);color:var(--lc);border:1px solid color-mix(in srgb,var(--lc) 35%,transparent)}
.ph.phero .livechip{background:rgba(0,0,0,.4);color:#fff;border-color:rgba(255,255,255,.25)}
.livechip i{width:7px;height:7px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 0 var(--lc);animation:live 2s infinite}
@keyframes live{70%{box-shadow:0 0 0 6px transparent}}
.score{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 12%,transparent),transparent 70%)}
.gauge{position:relative;width:64px;height:64px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .trk{stroke:var(--line)}
.gauge .val{stroke:var(--gc);stroke-linecap:round}
.gauge.go .val{animation:gfill 1.1s cubic-bezier(.3,.9,.3,1) both}
@keyframes gfill{from{stroke-dashoffset:163.4}}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.score .sl{font-weight:700;color:var(--gc)}
.score small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.viz{--s1:#2a78d6;--s2:#eb6834;position:relative}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .viz{--s1:#3987e5;--s2:#d95926}}
:root[data-theme="dark"] .viz{--s1:#3987e5;--s2:#d95926}
.viz svg{display:block;width:100%;overflow:visible}
.viz .grid{stroke:var(--line);stroke-width:1}
.viz .axis{fill:var(--muted);font-size:10px}
.viz .band{fill:color-mix(in srgb,var(--ink) 6%,transparent)}
.viz .band-lbl{fill:var(--muted);font-size:9.5px}
.viz .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz .end{font-size:10.5px;fill:var(--ink)}
.viz .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.vtip{position:absolute;top:0;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .12s}
.vtip.show{opacity:1}
.vtip b{display:block;margin-bottom:2px}
.vtip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.tl-now{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:#ef4444;border-radius:1px;pointer-events:none}
.tl-now::after{content:"now";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9.5px;color:#ef4444;font-weight:700}
.moon{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel-2);margin-top:16px}
.moon svg{flex:none;filter:drop-shadow(0 0 6px rgba(226,232,240,.35))}
.moon small{display:block;color:var(--muted);font-size:12px}
/* photo planning */
.glance{display:grid;gap:12px}
.glance > div{display:flex;gap:12px;align-items:flex-start;font-size:13.5px}
.glance svg{color:var(--c);flex:none;margin-top:1px}
.glance small{display:block;color:var(--muted);font-size:11.5px}
.ncard{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--panel-2)}
.ncard > .ni{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ncard > div:last-child{flex:1;min-width:0}
.ncard h5{margin:0 0 2px;font-size:14px}
.ncard p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ncard .big{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.mstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--muted)}
.mstrip > div{display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:10px}
.mstrip > div.dark{background:color-mix(in srgb,#16a34a 12%,transparent);color:var(--ink)}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.hr{flex:none;width:58px;display:grid;justify-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:var(--panel-2);font-size:11.5px;scroll-snap-align:start}
.hr.gold{box-shadow:inset 0 3px 0 #f59e0b}.hr.blue{box-shadow:inset 0 3px 0 #3b6fd8}
.hr svg{width:18px;height:18px;color:var(--c)}
.hr b{font-size:13px;font-variant-numeric:tabular-nums}
.hr .w{color:var(--muted)}
.cond{display:grid;gap:10px}
.cond > div{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.cond .tag{flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);min-width:64px;text-align:center}
.planner{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.planner .row b{font-variant-numeric:tabular-nums}
.alg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.alg span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.calb{padding:2px 6px !important;margin-left:4px;vertical-align:middle;color:var(--accent)}
.calb svg{width:15px;height:15px}
.gform{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.gform label{display:grid;gap:4px;font-size:11.5px;color:var(--muted)}
.gform input,.gform select{padding:7px 8px}
.tcard{margin-top:12px;padding:12px;border-radius:12px;border:1px solid color-mix(in srgb,#16a34a 40%,var(--line));background:color-mix(in srgb,#16a34a 7%,transparent);display:grid;gap:8px;font-size:13px}
.tcard .row label{font-size:12px;color:var(--muted)}
.lu{display:grid;gap:6px;margin-top:4px}
.lu > div{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--panel-2)}
.lu > div > span:nth-child(2){flex:1;min-width:0}
.lu b{font-variant-numeric:tabular-nums}
body.picking #map{cursor:crosshair}
@media (max-width:760px){body.picking .drawer{transform:translateY(105%)}}
.nights{display:grid;gap:6px}
.night{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--panel-2);font-size:12.5px}
.night.best{box-shadow:inset 0 0 0 1.5px #16a34a}
.night .sc{font-weight:700;font-variant-numeric:tabular-nums;color:var(--c)}
.cloudrow{display:flex;gap:3px;align-items:flex-end;height:46px;margin-top:8px}
.cloudrow > i{flex:1;min-width:4px;border-radius:3px 3px 1px 1px;background:var(--c);opacity:.85}
.cloudrow-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px}
.plan{padding:12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));font-size:13px;display:grid;gap:4px}
/* light timeline */
.tl{position:relative;height:30px;border-radius:10px;margin:18px 0 4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.tl input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:ew-resize}
.tl input[type=range]::-webkit-slider-runnable-track{background:transparent;height:30px}
.tl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:38px;margin-top:-4px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px #1d1c1a,0 3px 8px rgba(0,0,0,.4)}
.tl input[type=range]::-moz-range-track{background:transparent}
.tl input[type=range]::-moz-range-thumb{width:8px;height:38px;border-radius:4px;background:#fff;border:2px solid #1d1c1a}
.tl-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:16px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.tm{display:flex;gap:10px;align-items:flex-start}
.tm i{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none}
.tm small{display:block;color:var(--muted);font-size:11.5px}
.tm b{font-size:14px;font-variant-numeric:tabular-nums}
.sun-now svg circle,.sun-now svg{transition:all .2s}
/* place info panel */
.ph{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--panel)),var(--panel));align-items:center;gap:12px}
.badge{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--c) 45%,transparent)}
.badge svg{width:20px;height:20px}
.ph .sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ani{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.ani-pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-12deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:14px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 9px;display:grid;gap:3px;min-width:0}
.stat svg{color:var(--c);width:16px;height:16px}
.stat b{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:11px;color:var(--muted)}
.ht{display:inline-flex;align-items:center;gap:8px}
.hic{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.hic svg{width:13px;height:13px}
.kv{display:grid;gap:9px}
.kv > div{display:grid;grid-template-columns:16px 88px 1fr;gap:8px;align-items:start;font-size:13.5px}
.kv svg{width:15px;height:15px;color:var(--muted);margin-top:2px}
.kv .k{color:var(--muted)}
.kv .v{overflow-wrap:anywhere}
.tipcard{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;
  background:linear-gradient(135deg,color-mix(in srgb,#f59e0b 13%,transparent),color-mix(in srgb,#a855f7 9%,transparent));border:1px solid color-mix(in srgb,#f59e0b 28%,var(--line))}
.tipcard svg{color:#f59e0b;flex:none;margin-top:1px}
.qd{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-variant-numeric:tabular-nums}
.qd::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.wx-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.wx-ic svg{width:24px;height:24px}
.pin.drop{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{opacity:0;transform:rotate(-45deg) translate(18px,-18px) scale(.6)}}
.pulse{width:44px;height:44px;border-radius:50%;border:2px solid #0284c7;animation:ring 1.4s ease-out 2 both}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion: reduce){.gauge.go .val,.hero-in,.livechip i,.stagger > *,.pind,.ptabs .ld,.ani,.ani-pop,.pin.drop,.pulse,.skel,.pin.temp{animation:none}}
.callout{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px}
.me-dot{position:relative;width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.me-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #2563eb;animation:mering 2s ease-out infinite}
@keyframes mering{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.me-dot::after{animation:none}}
.leaflet-tooltip.lbl{font-weight:600}

/* Drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:1100;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s ease}
.drawer.open{transform:none}
.dhead{display:flex;align-items:flex-start;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.dbody{overflow:auto;flex:1;padding:0 16px 24px}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.facts{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery button{aspect-ratio:4/3;border-radius:7px;border:1px solid var(--line);background:var(--panel-2) center/cover no-repeat;padding:0}
.gallery .add{display:grid;place-items:center;color:var(--muted);border-style:dashed;background:none;font-size:12px}
.gallery .add div{display:grid;place-items:center;gap:4px}
.hero{aspect-ratio:16/9;border-radius:var(--radius);background:var(--panel-2) center/cover no-repeat;margin-top:14px;border:1px solid var(--line);cursor:zoom-in;width:100%;padding:0}
.notes{white-space:pre-wrap;font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.sun-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sun-cell{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.sun-cell b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.sun-cell small{color:var(--muted);font-size:11.5px}
.sun-cell.gold{border-color:color-mix(in srgb, #e0a100 50%, var(--line))}
.sun-cell.blue{border-color:color-mix(in srgb, #3b6fd8 50%, var(--line))}
.sun-now{display:flex;gap:14px;align-items:center;margin:12px 0}
.sun-now .readout{font-size:13px;display:grid;gap:2px}
.sun-now .readout b{font-size:20px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}

form.edit{display:grid;gap:12px;padding-top:14px}
form.edit label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
form.edit label > span{font-weight:600}
form.edit .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.edit fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 12px;display:grid;gap:10px;margin:0}
form.edit legend{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 4px}
.formfoot{position:sticky;bottom:0;background:var(--panel);padding:12px 0 4px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
textarea{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:calc(100vh - 120px);border-radius:6px}
.lightbox .lb-bar{display:flex;gap:8px;align-items:center;color:#eee}
.lightbox .btn{background:#222;border-color:#444;color:#eee}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:28px;background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:64px;border-radius:8px}
.lb-prev{left:12px}.lb-next{right:12px}

.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:3000;transition:.2s;pointer-events:none;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%)}

.mobile-tabs{display:none}
.hide-sm{}

@media (max-width:760px){
  body{grid-template-rows:auto 1fr auto}
  .topbar{padding:8px 16px;padding-top:max(8px, env(safe-area-inset-top));gap:8px;flex-wrap:wrap}
  .drawer{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .brand span.name{display:none}
  .search{order:5;flex-basis:100%;max-width:none}
  .hide-sm{display:none}
  .layout{grid-template-columns:1fr}
  #sidebar,#mapWrap{grid-area:1/1}
  #sidebar{border-right:0}
  body[data-view="map"] #sidebar{display:none}
  body[data-view="list"] #mapWrap{visibility:hidden}
  .drawer{position:fixed;inset:0;width:auto;border-left:0;z-index:1500}
  .mobile-tabs{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
  .mobile-tabs button{flex:1;padding:12px;border:0;background:none;display:flex;gap:6px;justify-content:center;align-items:center;color:var(--muted)}
  .mobile-tabs button.on{color:var(--accent);font-weight:600}
  .map-tools{max-width:calc(100% - 70px)}
  .place input{width:180px}
  .banner{bottom:16px;max-width:calc(100% - 32px)}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;

const STATUS = {
  scouted:     { label: 'Scouted',     c: 'var(--st-scouted)' },
  shortlisted: { label: 'Shortlisted', c: 'var(--st-shortlisted)' },
  approved:    { label: 'Approved',    c: 'var(--st-approved)' },
  rejected:    { label: 'Rejected',    c: 'var(--st-rejected)' },
};
const OPTS = {
  type: ['Exterior', 'Interior', 'Int / Ext'],
  parking: ['Unknown', 'None', 'Street only', 'Small lot', 'Ample (trucks OK)'],
  power: ['Unknown', 'None — generator needed', 'House power', 'Tie-in available'],
  restrooms: ['Unknown', 'None', 'On site', 'Nearby'],
  permit: ['Unknown', 'Not required', 'Required', 'Applied', 'Obtained'],
  noise: ['Unknown', 'Quiet', 'Moderate', 'Loud (traffic / flight path)'],
};

/* ---------- storage ---------- */
const DB = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('scoutbook', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('locations', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('locations', mode); const req = fn(t.objectStore('locations'));
      t.oncomplete = () => res(req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    all: () => tx('readonly', s => s.getAll()),
    put: o => tx('readwrite', s => s.put(o)),
    del: id => tx('readwrite', s => s.delete(id)),
  };
})();
let persistOK = true;
async function save(loc) { try { await DB.put(loc); } catch (e) { persistOK = false; toast('Could not save to browser storage: ' + (e?.message || e)); } }
async function remove(id) { try { await DB.del(id); } catch (e) { toast('Could not delete from storage'); } }
const pref = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

/* ---------- state ---------- */
const state = {
  locations: [],
  filter: { q: '', status: new Set(), project: '', sort: 'updated' },
  sel: null,          // selected location id
  mode: 'view',       // view | edit
  draft: null,        // object being edited
  adding: false,
  me: null,           // [lat,lng]
  sun: { date: todayStr(), min: nowMin(), show: true },
  lb: null,
  ptab: 'overview', ptabDir: 'r', face: null, kp: null, picking: null,
  spot: null,         // place / viewpoint shown in the info panel
};

function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function nowMin() { const d = new Date(); return Math.round((d.getHours()*60 + d.getMinutes()) / 5) * 5; }
const byId = id => state.locations.find(l => l.id === id);

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: false, worldCopyJump: true }).setView([34.06, -118.3], 10);
L.control.zoom({ position: 'bottomright' }).addTo(map);
if ('ResizeObserver' in window) new ResizeObserver(() => map.invalidateSize()).observe($('#map'));
const base = {
  'Street': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery &copy; Esri' }),
  'Topo': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '&copy; OpenTopoMap (CC-BY-SA)' }),
};
base[pref.get('sb-base') in base ? pref.get('sb-base') : 'Street'].addTo(map);
map.on('baselayerchange', e => pref.set('sb-base', e.name));
const vpLayer = L.layerGroup().addTo(map);
L.control.layers(base, { 'OSM viewpoints': vpLayer }, { position: 'topright' }).addTo(map);
const markerLayer = L.layerGroup().addTo(map);
const sunLayer = L.layerGroup().addTo(map);
let markers = {}, tempMarker = null, meMarker = null;

const pinIcon = (color, cls = '') => L.divIcon({ className: 'pin-wrap', html: `<div class="pin ${cls}" style="--c:${color}"><span></span></div>`, iconSize: [26, 34], iconAnchor: [13, 34], tooltipAnchor: [0, -30] });

function renderMarkers() {
  markerLayer.clearLayers(); markers = {};
  for (const l of visible()) {
    if (state.mode === 'edit' && state.draft && l.id === state.draft.id) continue;
    const m = L.marker([l.lat, l.lng], { icon: pinIcon(STATUS[l.status]?.c || STATUS.scouted.c, l.id === state.sel ? 'sel' : ''), zIndexOffset: l.id === state.sel ? 500 : 0, title: l.name })
      .bindTooltip(esc(l.name), { direction: 'top', className: 'lbl' })
      .on('click', () => select(l.id));
    m.addTo(markerLayer); markers[l.id] = m;
  }
}

let clickT;
map.on('click', e => {
  clearTimeout(clickT);
  clickT = setTimeout(() => {
    const { lat, lng } = e.latlng;
    if (state.picking) setTarget(lat, lng);
    else if (state.adding) startNew(lat, lng);
    else if (state.mode === 'edit') { if (tempMarker) tempMarker.setLatLng([lat, lng]); setCoordInputs(lat, lng); }
    else inspectPlace(lat, lng);
  }, 250);
});
map.on('dblclick', () => clearTimeout(clickT));
map.on('zoomend', () => drawSun());
map.on('moveend', () => { const c = map.getCenter(); pref.set('sb-view', JSON.stringify([+c.lat.toFixed(5), +c.lng.toFixed(5), map.getZoom()])); });

const savedFor = s => state.locations.find(l => l.spotId === s.id);
function selectSpot(s, { pan = true } = {}) {
  if (state.mode === 'edit') cancelEdit(false);
  if (state.spot?.id !== s.id) { const tz = tzOf(s); state.sun.date = todayIn(tz); state.sun.min = nowMinIn(tz); state.ptab = 'overview'; state.face = null; }
  state.sel = null; state.spot = s; state.mode = 'view';
  if (s.kind !== 'place') placeLayer.clearLayers();
  enrich(s);
  renderList(); renderMarkers(); renderDrawer();
  if (pan) map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 14), { duration: .6 });
  setView('map');
}
/* ---------- place info (click anywhere on the map) ---------- */
const placeLayer = L.layerGroup().addTo(map);
const WMO = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Freezing fog', 51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain', 71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains', 80: 'Light showers', 81: 'Showers', 82: 'Violent showers', 85: 'Snow showers', 86: 'Snow showers', 95: 'Thunderstorm', 96: 'Thunderstorm with hail', 99: 'Thunderstorm with hail' };
const pretty = x => String(x || '').replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : (u && /^[\w.-]+\.[a-z]{2,}/i.test(u) ? 'https://' + u : '');
function inspectPlace(lat, lng) {
  const s = { id: 'p' + uid(), kind: 'place', name: 'Finding this place…', lat, lng, region: '', address: '', cat: 'Map location', tz: DEVICE_TZ, best: '', tip: '' };
  placeLayer.clearLayers();
  L.marker([lat, lng], { icon: L.divIcon({ className: 'pin-wrap', html: '<div class="pulse"></div>', iconSize: [44, 44], iconAnchor: [22, 22] }), interactive: false }).addTo(placeLayer);
  const pin = L.marker([lat, lng], { icon: pinIcon('#0284c7', 'sel drop'), draggable: true, zIndexOffset: 900, title: 'Drag to move' }).addTo(placeLayer);
  pin.on('dragend', e => { const p = e.target.getLatLng(), tab = state.ptab; inspectPlace(p.lat, p.lng); if (tab !== 'overview') { state.ptab = tab; renderSpotDrawer(); } });
  selectSpot(s, { pan: false });
  try { history.replaceState(null, '', `#@${lat.toFixed(5)},${lng.toFixed(5)}`); } catch {}
}
function enrich(s) {
  if (s.enriched) return; s.enriched = true;
  s.loading = { geo: true, wx: true, wiki: true, marine: true };
  const upd = () => { if (state.spot === s && state.mode === 'view') renderSpotDrawer(); };
  const geoP = (s.loading.geo ? fetchGeo(s) : Promise.resolve()).finally(() => { s.loading.geo = false; upd(); });
  fetchWeather(s).finally(() => { s.loading.wx = false; upd(); });
  fetchMarine(s).finally(() => { s.loading.marine = false; upd(); });
  getKp().then(k => { if (k && !state.kp) { state.kp = k; upd(); } });
  fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${s.lat}&longitude=${s.lng}&current=pm2_5,aerosol_optical_depth,dust,european_aqi,us_aqi&timezone=auto`)
    .then(r => r.json()).then(j => { s.air = j.current || null; upd(); }).catch(() => {});
  geoP.then(() => fetchWiki(s)).finally(() => { s.loading.wiki = false; upd(); });
}
async function fetchGeo(s) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${s.lat}&lon=${s.lng}&zoom=18&addressdetails=1&extratags=1&namedetails=1`);
    const j = await r.json(); const a = j.address || {};
    if (j.error) { if (s.kind === 'place') { s.name = 'Unnamed location'; s.cat = 'Remote area / water'; } return; }
    const nm = j.name || a.tourism || a.amenity || a.leisure || a.natural || a.historic || a.building ||
      (a.road ? [a.house_number, a.road].filter(Boolean).join(' ') : '') || a.hamlet || a.village || a.suburb || a.town || a.city || a.county || 'Dropped pin';
    const nm2 = j.category === 'highway' && /^[\w-]{1,6}$/.test(nm) && /\d/.test(nm) ? (a.village || a.town || a.hamlet || a.suburb || a.city || `Road ${nm}`) : nm;
    if (s.kind === 'place' || /^Unnamed/.test(s.name)) s.name = nm2;
    s.address ||= j.display_name || '';
    s.region ||= [a.city || a.town || a.village || a.hamlet || a.municipality || a.county, a.state, a.country].filter(Boolean).join(', ');
    const trivial = j.category === 'emergency' || ['bench', 'waste_basket', 'vending_machine', 'bicycle_parking', 'post_box', 'telephone', 'drinking_water', 'recycling', 'street_lamp', 'parking_entrance', 'atm', 'charging_station', 'car_sharing', 'defibrillator', 'fire_hydrant'].includes(j.type);
    if (s.kind === 'place' && j.category) s.cat = trivial ? (a.road ? 'Street' : 'Map location')
      : ['boundary', 'place'].includes(j.category) ? `Area · ${pretty(j.addresstype || j.type)}` : `${pretty(j.category)} · ${pretty(j.type)}`;
    if (s.kind === 'place' && trivial && j.name && a.road) s.name = a.road;
    s.cc = (a.country_code || '').toLowerCase();
    s.extra = j.extratags || {};
    if (s.extra.ele && !s.ele) s.ele = s.extra.ele;
    s.osmRef = j.osm_type && j.osm_id ? `${j.osm_type}/${j.osm_id}` : '';
  } catch { s.geoErr = true; if (s.kind === 'place') s.name = 'Dropped pin'; }
}
function skyQuality(h) {
  if (!h) return { cls: 'mixed', label: 'No data' };
  if (h.pp >= 60) return { cls: 'flat', label: `Rain likely (${h.pp}%)` };
  if (h.low >= 70 || h.cc >= 90) return { cls: 'flat', label: 'Overcast — flat light' };
  if (h.high >= 25 && h.high <= 85 && h.low < 50) return { cls: 'good', label: 'Colourful sky likely' };
  if (h.cc <= 10) return { cls: 'clear', label: 'Clear — clean, plain sky' };
  return { cls: 'mixed', label: 'Mixed clouds' };
}
async function fetchWeather(s) {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lng}&timezone=auto&forecast_days=4` +
      `&current=temperature_2m,apparent_temperature,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m,wind_direction_10m,relative_humidity_2m,visibility,dew_point_2m` +
      `&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,precipitation_probability,temperature_2m,dew_point_2m,weather_code,wind_speed_10m,wind_gusts_10m,visibility&daily=sunrise,sunset,uv_index_max`;
    const j = await (await fetch(u)).json();
    if (j.error) throw new Error(j.reason);
    if (j.timezone && validTz(j.timezone) && j.timezone !== s.tz) {
      s.tz = j.timezone;
      if (state.spot === s) { state.sun.date = todayIn(s.tz); state.sun.min = nowMinIn(s.tz); }
    }
    if (isFinite(j.elevation) && !s.ele) s.ele = Math.round(j.elevation);
    const H = j.hourly, idx = {}; H.time.forEach((t, i) => idx[t] = i);
    const at = iso => { // nearest hour (local ISO strings, compared as UTC for arithmetic only)
      const t = new Date(Math.round(Date.parse(iso + ':00Z') / 36e5) * 36e5).toISOString().slice(0, 13) + ':00';
      const i = idx[t]; if (i == null) return null;
      return { cc: H.cloud_cover[i], low: H.cloud_cover_low[i], high: H.cloud_cover_high[i], pp: H.precipitation_probability?.[i] ?? 0 };
    };
    s.wx = {
      cur: j.current,
      days: j.daily.time.map((d, i) => ({ date: d, rise: j.daily.sunrise[i], set: j.daily.sunset[i], uv: j.daily.uv_index_max?.[i], r: at(j.daily.sunrise[i]), s: at(j.daily.sunset[i]) })),
      H, start: Math.max(0, H.time.indexOf(j.current.time.slice(0, 13) + ':00')),
    };
    const now = j.current.time;
    const next = s.wx.days.flatMap(d => [{ k: 'sunrise', t: d.rise, h: d.r }, { k: 'sunset', t: d.set, h: d.s }]).find(e => e.t > now && e.h);
    s.next = next || null;
    // fog / mist risk around the next sunrise: small temperature–dew point spread + light wind (or low visibility)
    const nr = s.wx.days.map(d => d.rise).find(t => t > now);
    if (nr) {
      const k = idx[new Date(Math.round(Date.parse(nr + ':00Z') / 36e5) * 36e5).toISOString().slice(0, 13) + ':00'];
      if (k != null) {
        const spread = H.temperature_2m[k] - H.dew_point_2m[k], wind = H.wind_speed_10m[k], vis = H.visibility?.[k];
        const lvl = (vis != null && vis < 1000) || (spread <= 1.5 && wind < 10) ? 'likely' : spread <= 3 && wind < 15 ? 'possible' : 'unlikely';
        s.fog = { lvl, t: nr.slice(11, 16), day: nr.slice(0, 10) === now.slice(0, 10) ? 'today' : 'tomorrow', spread, wind, temp: H.temperature_2m[k] };
      }
    }
    if (next) {
      const q = skyQuality(next.h), day = next.t.slice(0, 10) === now.slice(0, 10) ? 'today' : 'tomorrow';
      s.skyTip = `Next ${next.k} (${day} ${next.t.slice(11, 16)}): ${q.label.toLowerCase()} — ${next.h.cc}% cloud (low ${next.h.low}%, high ${next.h.high}%).`;
    }
  } catch (e) { s.wxErr = e.message || 'unavailable'; }
}
async function fetchWiki(s) {
  try {
    const g = await (await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${s.lat}|${s.lng}&gsradius=10000&gslimit=8&format=json&origin=*`)).json();
    s.nearby = (g.query?.geosearch || []).map(x => ({ title: x.title, lat: x.lat, lng: x.lon, dist: x.dist }));
    const nm = (s.name || '').toLowerCase();
    const byName = s.nearby.find(n => n.title.toLowerCase() === nm || n.title.toLowerCase().startsWith(nm + ','));
    let title = byName?.title || s.nearby[0]?.title, exact = !!byName;
    const wt = s.extra?.wikipedia; if (wt && /^en:/.test(wt)) { title = wt.slice(3); exact = true; }
    if (title) {
      const sm = await (await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)).json();
      if (sm.extract) {
        s.wiki = { title: sm.title, extract: sm.extract, thumb: sm.thumbnail?.source, url: sm.content_urls?.desktop?.page, dist: s.nearby.find(n => n.title === sm.title)?.dist, exact };
        const th = s.wiki.thumb;

function compress(file, max = 1600, q = .82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Unreadable image')); };
    img.src = url;
  });
}

let meAcc = null, meWatch = null;
function setMe(pos) {
  state.me = [pos.coords.latitude, pos.coords.longitude];
  if (!meMarker) meMarker = L.marker(state.me, { icon: L.divIcon({ className: 'pin-wrap', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false, zIndexOffset: -100, keyboard: false }).addTo(map);
  else meMarker.setLatLng(state.me);
  const acc = Math.min(pos.coords.accuracy || 0, 2000);
  if (!meAcc) meAcc = L.circle(state.me, { radius: acc, color: '#2563eb', weight: 1, opacity: .4, fillOpacity: .08, interactive: false }).addTo(map);
  else meAcc.setLatLng(state.me).setRadius(acc);
}
function startWatch() {
  if (meWatch != null || !navigator.geolocation) return;
  let last = 0;
  meWatch = navigator.geolocation.watchPosition(pos => {
    setMe(pos);
    if (Date.now() - last > 15000) { last = Date.now(); renderList(); } // keep distances fresh without constant re-rendering
  }, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
}
function locate(then, { quiet = false } = {}) {
  if (!navigator.geolocation) { if (!quiet) toast('Location is not supported on this device'); return; }
  if (!quiet) toast('Finding your location…');
  navigator.geolocation.getCurrentPosition(pos => {
    setMe(pos); startWatch();
    renderList(); if (state.mode === 'view' && (state.sel || state.spot)) renderDrawer();
    then ? then(state.me) : map.flyTo(state.me, Math.max(map.getZoom(), 15), { duration: .6 });
  }, err => {
    toast(err.code === 1 ? 'Location access is blocked — allow it in your browser/site settings to start at your position' : 'Could not get your location: ' + err.message);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

  try { perm = (await navigator.permissions.query({ name: 'geolocation' })).state; } catch {}
  if (perm === 'denied') toast('Location is blocked — allow it in your browser/site settings to start at your position');
  else {
    const t0 = Date.now();
    locate(me => {
      if (shared) return;
      const busy = state.spot || state.sel || state.mode === 'edit' || state.adding; // user already started doing something
      if (busy && Date.now() - t0 > 1500) return;
      map.setView(me, 15); inspectPlace(me[0], me[1]);
    }, { quiet: shared });
  }
  if (typeof SunCalc === 'undefined') console.warn('SunCalc failed to load');
})();
})();
</script>
